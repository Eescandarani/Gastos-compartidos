<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gastos del mes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="cargando">

<div class="header">
  <div class="header-inner ancho">
    <h1>Gastos del mes</h1>
  </div>
</div>

<div class="tablero">
  <div class="columna">

    <div class="filtros">
      <select class="filtro-select" id="t-mes" aria-label="Mes"></select>
      <select class="filtro-select" id="t-anio" aria-label="Año"></select>
    </div>

    <div class="total-mes">
      <span class="rotulo">Total gastado en el mes</span>
      <span class="monto esq-texto" id="t-total">$0</span>
    </div>

    <div class="pagos">
      <button type="button" class="pago-card" data-persona="A">
        <span class="quien"><span>Pagó <span class="nombre-a"></span></span><span class="chevron">›</span></span>
        <span class="monto esq-texto" id="t-pago-a">$0</span>
      </button>
      <button type="button" class="pago-card" data-persona="B">
        <span class="quien"><span>Pagó <span class="nombre-b"></span></span><span class="chevron">›</span></span>
        <span class="monto esq-texto" id="t-pago-b">$0</span>
      </button>
    </div>

    <button type="button" class="saldos-btn" id="t-saldos">
      <span class="titulo">Saldos</span>
      <span class="detalle">
        <span class="resumen esq-texto" id="t-saldos-resumen"></span>
        <span class="chevron">›</span>
      </span>
    </button>

    <div>
      <div class="torta-card">
        <div class="torta" id="t-torta"></div>
        <div class="categorias" id="t-categorias"></div>
      </div>
      <div class="filtro-cat" id="t-filtro-cat"></div>
    </div>

  </div>
  <div class="columna">
    <div style="animation: fadeUp 0.3s ease both; animation-delay: 0.15s;">
      <div class="rotulo-fila">
        <span class="rotulo">Gastos del mes</span>
        <span class="estado esq-texto" id="t-estado">Cargando…</span>
      </div>
      <div class="lista" id="t-lista"></div>
    </div>
  </div>
</div>

<div id="hojas"></div>

<nav class="navbar" id="navbar" data-actual="mes"></nav>
<div class="toast" id="toast"></div>

<script src="comun.js"></script>
<script src="tablero.js"></script>
</body>
</html>
