<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nuevo gasto compartido</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gastos" />
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: rgba(255,255,255,0.07);
      --accent: #c084fc;
      --accent2: #818cf8;
      --text: #f0f0f5;
      --text-muted: #6b6b80;
      --text-secondary: #9999b0;
      --success: #34d399;
      --error: #f87171;
      --radius: 14px;
      --radius-sm: 9px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15,15,19,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px 14px;
    }

    .header-inner { display: flex; align-items: center; gap: 10px; }

    .header-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    .header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
    .header p  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    .form {
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 12px;
      max-width: 480px; margin: 0 auto;
    }

    .section-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 8px; padding-left: 4px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-row {
      display: flex; align-items: center;
      padding: 0 16px; min-height: 52px;
      border-bottom: 1px solid var(--border);
      gap: 12px; position: relative;
    }

    .card-row:last-child { border-bottom: none; }
    .card-row:focus-within { background: rgba(192,132,252,0.04); }

    .row-label {
      font-size: 15px; color: var(--text);
      flex-shrink: 0; min-width: 100px;
    }

    input, select, textarea {
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; font-family: inherit;
      flex: 1; text-align: right;
      -webkit-appearance: none; appearance: none;
    }

    input::placeholder { color: var(--text-muted); }

    select option { background: #1a1a22; color: var(--text); }

    .select-wrapper {
      flex: 1; display: flex; align-items: center;
      justify-content: flex-end; gap: 4px;
    }

    .select-wrapper select { flex: 1; cursor: pointer; color: var(--text-secondary); text-align: left; }
    .select-wrapper select.has-value { color: var(--text); }

    .chevron { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }

    /* Monto — $ siempre pegado al número */
    .monto-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .monto-inner {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .currency-tag {
      font-size: 22px; font-weight: 300;
      color: var(--text); flex-shrink: 0;
      letter-spacing: -0.5px; line-height: 1;
      display: none;
    }

    .monto-input {
      font-size: 22px; font-weight: 300;
      letter-spacing: -0.5px;
      flex: none;
      width: auto;
      min-width: 2ch;
      max-width: 180px;
      text-align: left;
    }

    /* Cuando está vacío mostramos placeholder centrado a la derecha */
    .monto-input:placeholder-shown {
      min-width: 60px;
      text-align: right;
    }

    /* Segment */
    .segment {
      display: flex; background: var(--surface2);
      border-radius: var(--radius-sm); padding: 3px; gap: 2px;
    }

    .segment-btn {
      flex: 1; padding: 7px 8px; border: none; border-radius: 7px;
      background: transparent; color: var(--text-muted);
      font-size: 13px; font-weight: 500; font-family: inherit;
      cursor: pointer; transition: all 0.18s ease;
      text-align: center; white-space: nowrap;
    }

    .segment-btn.active {
      background: var(--surface); color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    /* "Los 2" recibe más flex para no romper en 2 líneas */
    .segment-btn.wide { flex: 1.5; }

    .cuotas-row { display: none; }
    .cuotas-row.visible { display: flex; }

    .stepper { display: flex; align-items: center; gap: 12px; margin-left: auto; }

    .stepper-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--surface2); color: var(--text);
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }

    .stepper-btn:active  { background: var(--accent); }
    .stepper-btn:disabled { opacity: 0.3; cursor: default; }

    .stepper-value {
      font-size: 17px; font-weight: 500;
      min-width: 24px; text-align: center; color: var(--text);
    }

    /* Resumen row */
    .resumen-row { gap: 10px; }

    .cal-icon { font-size: 17px; flex-shrink: 0; opacity: 0.65; }

    .resumen-selects {
      display: flex; align-items: center;
      flex: 1; justify-content: flex-start;
    }

    .resumen-selects select { color: var(--text); cursor: pointer; padding: 0 2px; text-align: left; }

    .date-sep { color: var(--text-muted); font-size: 15px; padding: 0 3px; flex-shrink: 0; }

    .corresponde-note {
      font-size: 11px; color: var(--text-muted);
      padding: 8px 16px 10px; line-height: 1.4;
    }

    .submit-btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 16px; font-weight: 600;
      font-family: inherit; border: none; border-radius: var(--radius);
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      letter-spacing: -0.2px;
    }

    .submit-btn:active   { opacity: 0.85; transform: scale(0.98); }
    .dashboard-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 10px;
      transition: color 0.2s;
    }

    .dashboard-btn:active { color: var(--accent); }

    .submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 12px 20px; border-radius: 24px;
      font-size: 14px; font-weight: 500; white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 100; display: flex; align-items: center; gap: 8px;
    }

    .toast.show    { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(52,211,153,0.3); }
    .toast.error   { border-color: rgba(248,113,113,0.3); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.6s linear infinite; flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .section { animation: fadeUp 0.3s ease both; }
    .section:nth-child(1) { animation-delay: 0.05s; }
    .section:nth-child(2) { animation-delay: 0.10s; }
    .section:nth-child(3) { animation-delay: 0.15s; }
    .section:nth-child(4) { animation-delay: 0.20s; }
    .section:nth-child(5) { animation-delay: 0.25s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Hero monto */
    .hero-monto {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 0px;
    }

    .hero-monto-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .hero-currency {
      font-size: 36px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: -1px;
      line-height: 1;
      display: none;
      padding-top: 6px;
    }

    .hero-monto-input {
      font-size: 56px;
      font-weight: 200;
      letter-spacing: -3px;
      color: var(--text);
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      text-align: center;
      width: auto;
      min-width: 3ch;
      max-width: 280px;
      line-height: 1;
      -webkit-appearance: none;
      appearance: none;
    }

    .hero-monto-input::placeholder {
      color: var(--text-muted);
    }

    /* Descripción flotante */
    .descripcion-flotante {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
      margin-top: 0;
    }

    .descripcion-flotante input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-secondary);
      font-size: 16px;
      font-family: inherit;
      text-align: center;
      padding: 0 0 24px;
      margin-top: 0;
      -webkit-appearance: none;
      appearance: none;
    }

    .descripcion-flotante input::placeholder {
      color: var(--text-muted);
    }


    /* ===== Carga masiva ===== */
    .view { display: none; }
    .view.active { display: block; }

    .back-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      background: var(--surface2); border: none; border-radius: 8px;
      color: var(--text); font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s; padding-bottom: 2px;
    }

    .back-btn:active { background: var(--accent); }

    .card-title {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      padding: 14px 16px 11px; border-bottom: 1px solid var(--border);
    }

    .item-row {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 8px 11px 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .item-main { flex: 1; min-width: 0; }

    .item-desc {
      font-size: 15px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .item-meta,
    .item-meta-ctx { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .item-monto { font-size: 15px; font-weight: 500; color: var(--text); flex-shrink: 0; }

    .item-menu-btn {
      width: 28px; height: 28px; flex-shrink: 0;
      border: none; border-radius: 50%; background: transparent;
      color: var(--text-muted); font-size: 18px; font-family: inherit;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .item-menu-btn:active { background: var(--surface2); }

    .item-menu {
      position: fixed; z-index: 60;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow: hidden; min-width: 140px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
      animation: fadeUp 0.15s ease both;
    }

    .item-menu button {
      display: block; width: 100%; padding: 11px 14px; text-align: left;
      background: transparent; border: none; color: var(--text);
      font-size: 14px; font-family: inherit; cursor: pointer;
    }

    .item-menu button + button { border-top: 1px solid var(--border); color: var(--error); }
    .item-menu button:active { background: rgba(255,255,255,0.05); }

    .total-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    .total-label { font-size: 13px; color: var(--text-muted); }
    .total-value { font-size: 16px; font-weight: 600; color: var(--text); }

    .secondary-btn {
      width: 100%; padding: 14px;
      background: var(--surface2); border: none;
      border-top: 1px solid var(--border);
      color: var(--accent); font-size: 15px; font-weight: 500;
      font-family: inherit; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, background 0.2s;
    }

    .secondary-btn:active { opacity: 0.7; }

    /* Variante suelta, fuera de un card (acceso a carga masiva) */
    .secondary-btn.standalone {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      padding: 16px; margin-top: 10px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
    }

    .secondary-btn.standalone .chevron { color: var(--accent); font-size: 17px; }

    .secondary-btn.standalone:active {
      opacity: 1; transform: scale(0.98); background: var(--surface);
    }

    .monto-cell {
      flex: 1; display: flex; align-items: center;
      justify-content: flex-end; gap: 0;
    }

    .monto-cell .currency-tag-d { font-size: 17px; color: var(--text); flex-shrink: 0; }

    .monto-cell input {
      flex: none; width: auto; min-width: 60px;
      text-align: right; font-size: 17px;
    }

    @supports (-webkit-touch-callout: none) {
      input, select, textarea { font-size: 16px !important; }
      .monto-input            { font-size: 22px !important; }
      .currency-tag           { font-size: 22px !important; }
      .hero-monto-input       { font-size: 56px !important; }
      .hero-currency          { font-size: 36px !important; }
      .segment-btn            { font-size: 13px !important; }
    }
  </style>
</head>
<body>

<!-- ============ VISTA INDIVIDUAL ============ -->
<div class="view active" id="view-individual">

<div class="header">
  <div class="header-inner">
    <div class="header-icon">🏠</div>
    <div>
      <h1>Nuevo gasto compartido</h1>
    </div>
  </div>
</div>

<form class="form" id="form" onsubmit="return false;">

  <!-- HERO MONTO -->
  <div class="hero-monto">
    <div class="hero-monto-inner">
      <span class="hero-currency" id="currency-tag">$</span>
      <input
        class="hero-monto-input"
        type="text"
        id="monto"
        inputmode="numeric"
        placeholder="$0"
        autocomplete="off"
        oninput="formatMonto(this)"
      />
    </div>
  </div>

  <!-- DESCRIPCIÓN -->
  <div class="descripcion-flotante">
    <input type="text" id="descripcion" placeholder="Descripción" autocomplete="off" autocorrect="off" />
  </div>

  <!-- GASTO -->
  <div class="section">
    <div class="card">

      <div class="card-row">
        <div class="select-wrapper">
          <select id="categoria" onchange="this.classList.toggle('has-value', this.value !== '')">
            <option value="">Categoría</option>
            <option>Supermercado</option>
            <option>Comida</option>
            <option>Hogar</option>
            <option>Servicios</option>
            <option>Salidas</option>
            <option>Gustos</option>
            <option>Traslado/auto</option>
            <option>Otro</option>
          </select>
          <span class="chevron">›</span>
        </div>
      </div>

    </div>
  </div>

  <!-- PAGO + RESUMEN -->
  <div class="section">
    <div class="card">

      <div class="card-row">
        <div class="segment" id="seg-medio">
          <button type="button" class="segment-btn" data-value="Tarjeta de crédito" onclick="selectMedio('Tarjeta de crédito',this)">Tarjeta</button>
          <button type="button" class="segment-btn" data-value="Contado" onclick="selectMedio('Contado',this)">Contado</button>
        </div>
      </div>

      <div class="card-row cuotas-row" id="cuotas-row">
        <span class="row-label">Cuotas</span>
        <div class="stepper">
          <button type="button" class="stepper-btn" id="cuotas-minus" onclick="stepCuotas(-1)" disabled>−</button>
          <span class="stepper-value" id="cuotas-display">1</span>
          <button type="button" class="stepper-btn" id="cuotas-plus" onclick="stepCuotas(1)">+</button>
        </div>
      </div>

      <div class="card-row resumen-row">
        <div class="resumen-selects">
          <select id="mes-resumen">
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
          <span class="date-sep">/</span>
          <select id="anio-resumen"></select>
        </div>
      </div>

    </div>
  </div>

  <!-- PERSONAS -->
  <div class="section">
    <div class="card">

      <div class="card-row">
        <span class="row-label">Quién pagó</span>
        <div class="segment" id="seg-quien">
          <button type="button" class="segment-btn" data-value="Eze" onclick="selectSegment('quien','Eze',this)">Eze</button>
          <button type="button" class="segment-btn" data-value="Iru" onclick="selectSegment('quien','Iru',this)">Iru</button>
        </div>
      </div>

      <div class="card-row">
        <span class="row-label">Corresponde a</span>
        <div class="segment" id="seg-corresponde">
          <button type="button" class="segment-btn wide" data-value="Los 2" onclick="selectSegment('corresponde','Los 2',this)">Los 2</button>
          <button type="button" class="segment-btn" data-value="Eze" onclick="selectSegment('corresponde','Eze',this)">Eze</button>
          <button type="button" class="segment-btn" data-value="Iru" onclick="selectSegment('corresponde','Iru',this)">Iru</button>
        </div>
      </div>

      <div class="corresponde-note" id="corresponde-note">El gasto se divide 50/50.</div>

    </div>
  </div>

  <!-- SUBMIT -->
  <div class="section">
    <button type="button" class="submit-btn" id="submit-btn" onclick="submitForm()">
      Registrar gasto
    </button>
    <button type="button" class="secondary-btn standalone" onclick="irMasiva()">
      Carga masiva <span class="chevron">›</span>
    </button>
    <a href="https://datastudio.google.com/reporting/d9d5502c-7d67-4954-a63a-8ad81a9175c3/page/PJfxF" target="_blank" class="dashboard-btn">
      Tablero de gastos
    </a>
  </div>

</form>
</div>

<!-- ============ VISTA CARGA MASIVA ============ -->
<div class="view" id="view-masiva">

  <div class="header">
    <div class="header-inner">
      <button type="button" class="back-btn" onclick="irIndividual()">‹</button>
      <div>
        <h1>Carga masiva</h1>
        <p id="masiva-contador">Ningún gasto cargado</p>
      </div>
    </div>
  </div>

  <form class="form" onsubmit="return false;">

    <!-- GASTOS CARGADOS -->
    <div class="section" id="lista-section" style="display:none;">
      <div class="section-label">Gastos cargados</div>
      <div class="card">
        <div id="lista-items"></div>
        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-value" id="lista-total">$0</span>
        </div>
      </div>
    </div>

    <!-- FORMULARIO DEL GASTO -->
    <div class="section">
      <div class="card">

        <div class="card-title" id="draft-titulo">Gasto 1</div>

        <div class="card-row">
          <span class="row-label">Monto</span>
          <div class="monto-cell">
            <span class="currency-tag-d" id="d-currency" style="display:none;">$</span>
            <input type="text" id="d-monto" inputmode="numeric" placeholder="$0"
                   autocomplete="off" oninput="formatMontoDraft(this)" />
          </div>
        </div>

        <div class="card-row">
          <span class="row-label">Descripción</span>
          <input type="text" id="d-descripcion" placeholder="Ej. Verdulería" autocomplete="off" autocorrect="off" />
        </div>

        <div class="card-row">
          <div class="select-wrapper">
            <select id="d-categoria" onchange="this.classList.toggle('has-value', this.value !== '')">
              <option value="">Categoría</option>
              <option>Supermercado</option>
              <option>Comida</option>
              <option>Hogar</option>
              <option>Servicios</option>
              <option>Salidas</option>
              <option>Gustos</option>
              <option>Traslado/auto</option>
              <option>Otro</option>
            </select>
            <span class="chevron">›</span>
          </div>
        </div>

        <div class="card-row">
          <div class="segment" id="d-seg-medio">
            <button type="button" class="segment-btn active" data-value="Tarjeta de crédito" onclick="dSelectMedio('Tarjeta de crédito',this)">Tarjeta</button>
            <button type="button" class="segment-btn" data-value="Contado" onclick="dSelectMedio('Contado',this)">Contado</button>
          </div>
        </div>

        <div class="card-row cuotas-row visible" id="d-cuotas-row">
          <span class="row-label">Cuotas</span>
          <div class="stepper">
            <button type="button" class="stepper-btn" id="d-cuotas-minus" onclick="dStepCuotas(-1)" disabled>−</button>
            <span class="stepper-value" id="d-cuotas-display">1</span>
            <button type="button" class="stepper-btn" onclick="dStepCuotas(1)">+</button>
          </div>
        </div>

        <div class="card-row resumen-row">
          <span class="cal-icon">📅</span>
          <div class="resumen-selects">
            <select id="d-mes">
              <option value="1">Enero</option>
              <option value="2">Febrero</option>
              <option value="3">Marzo</option>
              <option value="4">Abril</option>
              <option value="5">Mayo</option>
              <option value="6">Junio</option>
              <option value="7">Julio</option>
              <option value="8">Agosto</option>
              <option value="9">Septiembre</option>
              <option value="10">Octubre</option>
              <option value="11">Noviembre</option>
              <option value="12">Diciembre</option>
            </select>
            <span class="date-sep">/</span>
            <select id="d-anio"></select>
          </div>
        </div>

        <div class="card-row">
          <span class="row-label">Quién pagó</span>
          <div class="segment" id="d-seg-quien">
            <button type="button" class="segment-btn" data-value="Eze" onclick="dSelectSegment('quien','Eze',this)">Eze</button>
            <button type="button" class="segment-btn" data-value="Iru" onclick="dSelectSegment('quien','Iru',this)">Iru</button>
          </div>
        </div>

        <div class="card-row">
          <span class="row-label">Corresponde a</span>
          <div class="segment" id="d-seg-corresponde">
            <button type="button" class="segment-btn wide active" data-value="Los 2" onclick="dSelectSegment('corresponde','Los 2',this)">Los 2</button>
            <button type="button" class="segment-btn" data-value="Eze" onclick="dSelectSegment('corresponde','Eze',this)">Eze</button>
            <button type="button" class="segment-btn" data-value="Iru" onclick="dSelectSegment('corresponde','Iru',this)">Iru</button>
          </div>
        </div>

        <button type="button" class="secondary-btn" id="draft-btn" onclick="confirmarGasto()">+ Nuevo gasto</button>

      </div>
    </div>

    <!-- CTAs -->
    <div class="section">
      <button type="button" class="submit-btn" id="masiva-submit" onclick="registrarMasivo()">
        Registrar gastos
      </button>
      <a href="https://datastudio.google.com/reporting/d9d5502c-7d67-4954-a63a-8ad81a9175c3/page/PJfxF" target="_blank" class="dashboard-btn">
        Tablero de gastos
      </a>
    </div>

  </form>
</div>

<div class="item-menu-layer" id="item-menu-layer"></div>

<div class="toast" id="toast"></div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw0eXUxtk04lXH2F5JUzLCiMRVes_ZPefD9OdsYoHEmKDv7lIH3zC_BEbq9zsKxieE/exec';

  const state = {
    quien: null,
    corresponde: 'Los 2',
    medio: 'Tarjeta de crédito',
    cuotas: 1,
  };

  function init() {
    const hoy = new Date();

    // Poblar años
    const anioSelect = document.getElementById('anio-resumen');
    const anioActual = hoy.getFullYear();
    for (let y = anioActual - 1; y <= 2030; y++) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      if (y === anioActual) opt.selected = true;
      anioSelect.appendChild(opt);
    }

    // Mes actual
    document.getElementById('mes-resumen').value = hoy.getMonth() + 1;

    // Preseleccionar "Los 2"
    document.querySelector('#seg-corresponde [data-value="Los 2"]').classList.add('active');

    // Preseleccionar Tarjeta
    document.querySelector('#seg-medio [data-value="Tarjeta de crédito"]').classList.add('active');
    document.getElementById('cuotas-row').classList.add('visible');

    // Precargar usuario por ?usuario=eze|iru
    const params = new URLSearchParams(window.location.search);
    const usuario = params.get('usuario');
    if (usuario) {
      const norm = usuario.charAt(0).toUpperCase() + usuario.slice(1).toLowerCase();
      const btn  = document.querySelector(`#seg-quien [data-value="${norm}"]`);
      if (btn) selectSegment('quien', norm, btn);
    }
  }

  function selectSegment(key, value, btn) {
    state[key] = value;
    const segId = key === 'quien' ? 'seg-quien' : 'seg-corresponde';
    document.querySelectorAll(`#${segId} .segment-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateCorrespondeNote();
  }

  function selectMedio(value, btn) {
    state.medio = value;
    document.querySelectorAll('#seg-medio .segment-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const row = document.getElementById('cuotas-row');
    if (value === 'Tarjeta de crédito') {
      row.classList.add('visible');
      state.cuotas = 1;
      updateCuotasDisplay();
    } else {
      row.classList.remove('visible');
      state.cuotas = 1;
    }
  }

  function updateCorrespondeNote() {
    const note = document.getElementById('corresponde-note');
    const { quien, corresponde } = state;
    if (!quien) {
      note.textContent = corresponde === 'Los 2'
        ? 'El gasto se divide 50/50.'
        : `El gasto corresponde al 100% a ${corresponde}.`;
      return;
    }
    if (corresponde === 'Los 2') {
      note.textContent = `${quien} pagó. El gasto se divide 50/50.`;
    } else if (corresponde !== quien) {
      note.textContent = `${quien} pagó, pero corresponde a ${corresponde}. ${corresponde} le debe el 100% a ${quien}.`;
    } else {
      note.textContent = `${quien} pagó un gasto que le corresponde íntegramente.`;
    }
  }

  function stepCuotas(delta) {
    state.cuotas = Math.max(1, Math.min(48, state.cuotas + delta));
    updateCuotasDisplay();
  }

  function updateCuotasDisplay() {
    document.getElementById('cuotas-display').textContent = state.cuotas;
    document.getElementById('cuotas-minus').disabled = state.cuotas <= 1;
  }

  function formatMonto(input) {
    const raw = input.value.replace(/\./g, '').replace(/[^0-9]/g, '');
    const tag  = document.getElementById('currency-tag');
    if (!raw) {
      input.value = '';
      input.placeholder = '$0';
      tag.style.display = 'none';
      return;
    }
    tag.style.display = 'inline';
    input.placeholder = '';
    const formatted = parseInt(raw, 10).toLocaleString('es-AR').replace(/,/g, '.');
    input.value = formatted;
    // Ajustar ancho dinámico al contenido
    input.style.width = (formatted.length + 1) + 'ch';
  }

  function getRawMonto() {
    const val = document.getElementById('monto').value;
    return parseFloat(val.replace(/\./g, '').replace(/,/g, '.')) || 0;
  }

  // Identifica el intento en curso. Si un envío falla y se reintenta con el
  // mismo contenido reusamos el id, así el Apps Script reconoce el lote y no
  // lo escribe dos veces; si el contenido cambió, es otro lote.
  let lotePendiente = null;

  function nuevoLoteId() {
    return crypto.randomUUID
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // Envía las filas y confirma contra la respuesta del Apps Script.
  // Usa text/plain para que sea una petición simple (sin preflight); el web app
  // devuelve CORS, así que sí podemos leer si la escritura salió bien.
  async function enviarFilas(filas) {
    const huella = JSON.stringify(filas);
    if (!lotePendiente || lotePendiente.huella !== huella) {
      lotePendiente = { huella, id: nuevoLoteId() };
    }

    const resp = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ loteId: lotePendiente.id, filas }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'El servidor rechazó el envío');

    lotePendiente = null;   // el lote quedó escrito: el próximo envío es otro
    return data;
  }

  // El Apps Script escribe fila por fila y con muchas cuotas demora: a los 5s
  // avisamos en vez de dejar el loader mudo
  function avisoDemora() {
    return setTimeout(() => {
      const el = document.getElementById('toast');
      if (el.classList.contains('show') && el.querySelector('.spinner')) {
        el.lastElementChild.textContent = 'Esto puede tomar unos segundos más…';
      } else {
        showToast('Esto puede tomar unos segundos más…', '', true);
      }
    }, 5000);
  }

  async function submitForm() {
    const descripcion = document.getElementById('descripcion').value.trim();
    const categoria   = document.getElementById('categoria').value;
    const monto       = getRawMonto();

    if (!state.quien)         return showToast('⚠️ Seleccioná quién pagó', 'error');
    if (!state.corresponde)   return showToast('⚠️ Seleccioná a quién corresponde', 'error');
    if (!descripcion)         return showToast('⚠️ Ingresá una descripción', 'error');
    if (!categoria)           return showToast('⚠️ Seleccioná una categoría', 'error');
    if (!monto || monto <= 0) return showToast('⚠️ Ingresá un monto válido', 'error');

    const mesResumen  = parseInt(document.getElementById('mes-resumen').value);
    const anioResumen = parseInt(document.getElementById('anio-resumen').value);
    const mesesNombre = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                         'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    const esCuotas = state.medio === 'Tarjeta de crédito' && state.cuotas > 1;
    const filas = [];

    for (let i = 0; i < (esCuotas ? state.cuotas : 1); i++) {
      const mesIdx    = (mesResumen - 1 + i) % 12;
      const anioExtra = anioResumen + Math.floor((mesResumen - 1 + i) / 12);
      filas.push({
        quienPago:        state.quien,
        correspondea:     state.corresponde,
        descripcion,
        categoria,
        monto,
        medioPago:        state.medio,
        esCuotas:         esCuotas ? 'Sí' : 'No',
        numeroCuota:      esCuotas ? i + 1 : 1,
        totalCuotas:      esCuotas ? state.cuotas : 1,
        montoTotal:       monto,
        montoCuota:       esCuotas ? monto / state.cuotas : monto,
        mesResumen:       mesesNombre[mesIdx],
        mesResumenNumero: mesIdx + 1,
        anioResumen:      anioExtra,
      });
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="margin:0 auto;"></div>';

    const demora = avisoDemora();

    try {
      await enviarFilas(filas);
      showToast('✓ Gasto registrado', 'success');
      resetForm();   // solo limpiamos si la escritura se confirmó
    } catch (err) {
      console.error(err);
      showToast('No se pudo registrar. Los datos siguen cargados.', 'error');
    } finally {
      clearTimeout(demora);
      btn.disabled = false;
      btn.textContent = 'Registrar gasto';
    }
  }

  function resetForm() {
    document.getElementById('descripcion').value = '';
    document.getElementById('categoria').value = '';
    document.getElementById('categoria').classList.remove('has-value');
    document.getElementById('monto').value = '';
    document.getElementById('monto').placeholder = '$0';
    document.getElementById('currency-tag').style.display = 'none';

    state.corresponde = 'Los 2';
    document.querySelectorAll('#seg-corresponde .segment-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('#seg-corresponde [data-value="Los 2"]').classList.add('active');

    state.medio = 'Tarjeta de crédito';
    state.cuotas = 1;
    document.querySelectorAll('#seg-medio .segment-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('#seg-medio [data-value="Tarjeta de crédito"]').classList.add('active');
    document.getElementById('cuotas-row').classList.add('visible');
    updateCuotasDisplay();
    updateCorrespondeNote();

    const hoy = new Date();
    document.getElementById('mes-resumen').value = hoy.getMonth() + 1;
    document.getElementById('anio-resumen').value = hoy.getFullYear();
  }

  let toastTimer;
  function showToast(msg, type = '', loading = false) {
    const el = document.getElementById('toast');
    el.innerHTML = (loading ? '<div class="spinner"></div>' : '') + '<span></span>';
    el.lastElementChild.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    if (!loading) toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  init();

  /* ============ CARGA MASIVA ============ */

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                 'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const MESES_CORTO = ['Ene','Feb','Mar','Abr','May','Jun',
                       'Jul','Ago','Sep','Oct','Nov','Dic'];

  const masiva = {
    items: [],
    nextId: 1,
    editingId: null,
    menuOpenId: null,
    quien: null,
    corresponde: 'Los 2',
    medio: 'Tarjeta de crédito',
    cuotas: 1,
  };

  function initMasiva() {
    const hoy = new Date();
    const anioSelect = document.getElementById('d-anio');
    const anioActual = hoy.getFullYear();
    for (let y = anioActual - 1; y <= 2030; y++) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      if (y === anioActual) opt.selected = true;
      anioSelect.appendChild(opt);
    }
    document.getElementById('d-mes').value = hoy.getMonth() + 1;

    // Cerrar el menú contextual al tocar fuera
    document.addEventListener('click', (e) => {
      if (masiva.menuOpenId === null) return;
      if (e.target.closest('.item-menu') || e.target.closest('.item-menu-btn')) return;
      masiva.menuOpenId = null;
      renderMasiva();
    });

    window.addEventListener('scroll', () => {
      if (masiva.menuOpenId === null) return;
      masiva.menuOpenId = null;
      renderMasiva();
    }, { passive: true });

    renderMasiva();
  }

  function irMasiva() {
    // El contexto arranca con lo que ya haya elegido en el form individual
    if (!masiva.quien && state.quien) dSelectSegment('quien', state.quien,
      document.querySelector(`#d-seg-quien [data-value="${state.quien}"]`));
    document.getElementById('view-individual').classList.remove('active');
    document.getElementById('view-masiva').classList.add('active');
    window.scrollTo(0, 0);
  }

  function irIndividual() {
    masiva.menuOpenId = null;
    renderMasiva();
    document.getElementById('view-masiva').classList.remove('active');
    document.getElementById('view-individual').classList.add('active');
    window.scrollTo(0, 0);
  }

  function dSelectSegment(key, value, btn) {
    if (!btn) return;
    masiva[key] = value;
    const segId = key === 'quien' ? 'd-seg-quien' : 'd-seg-corresponde';
    document.querySelectorAll(`#${segId} .segment-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function dSelectMedio(value, btn) {
    masiva.medio = value;
    document.querySelectorAll('#d-seg-medio .segment-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const row = document.getElementById('d-cuotas-row');
    masiva.cuotas = 1;
    row.classList.toggle('visible', value === 'Tarjeta de crédito');
    dUpdateCuotas();
  }

  function dStepCuotas(delta) {
    masiva.cuotas = Math.max(1, Math.min(48, masiva.cuotas + delta));
    dUpdateCuotas();
  }

  function dUpdateCuotas() {
    document.getElementById('d-cuotas-display').textContent = masiva.cuotas;
    document.getElementById('d-cuotas-minus').disabled = masiva.cuotas <= 1;
  }

  function formatMontoDraft(input) {
    const raw = input.value.replace(/\./g, '').replace(/[^0-9]/g, '');
    const tag = document.getElementById('d-currency');
    if (!raw) {
      input.value = '';
      input.placeholder = '$0';
      tag.style.display = 'none';
      return;
    }
    tag.style.display = 'inline';
    input.placeholder = '';
    input.value = parseInt(raw, 10).toLocaleString('es-AR').replace(/,/g, '.');
  }

  function dGetMonto() {
    const val = document.getElementById('d-monto').value;
    return parseFloat(val.replace(/\./g, '').replace(/,/g, '.')) || 0;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function limpiarDraft(ultimo) {
    const ctx = ultimo || {};
    document.getElementById('d-monto').value = '';
    document.getElementById('d-monto').placeholder = '$0';
    document.getElementById('d-currency').style.display = 'none';
    document.getElementById('d-descripcion').value = '';
    const cat = document.getElementById('d-categoria');
    cat.value = ''; cat.classList.remove('has-value');

    dSelectMedio('Tarjeta de crédito', document.querySelector('#d-seg-medio [data-value="Tarjeta de crédito"]'));

    // El mes/año, quién pagó y corresponde a se precargan con el gasto anterior
    if (ctx.mes)  document.getElementById('d-mes').value  = ctx.mes;
    if (ctx.anio) document.getElementById('d-anio').value = ctx.anio;
    if (ctx.quien) {
      dSelectSegment('quien', ctx.quien, document.querySelector(`#d-seg-quien [data-value="${ctx.quien}"]`));
    }
    if (ctx.corresponde) {
      dSelectSegment('corresponde', ctx.corresponde, document.querySelector(`#d-seg-corresponde [data-value="${ctx.corresponde}"]`));
    }

    masiva.editingId = null;
  }

  function confirmarGasto() {
    const monto       = dGetMonto();
    const descripcion = document.getElementById('d-descripcion').value.trim();
    const categoria   = document.getElementById('d-categoria').value;

    if (!monto || monto <= 0) return showToast('⚠️ Ingresá un monto válido', 'error');
    if (!descripcion)         return showToast('⚠️ Ingresá una descripción', 'error');
    if (!categoria)           return showToast('⚠️ Seleccioná una categoría', 'error');
    if (!masiva.quien)        return showToast('⚠️ Seleccioná quién pagó', 'error');
    if (!masiva.corresponde)  return showToast('⚠️ Seleccioná a quién corresponde', 'error');

    const item = {
      id: masiva.editingId ?? masiva.nextId++,
      monto,
      montoDisplay: document.getElementById('d-monto').value,
      descripcion,
      categoria,
      medio: masiva.medio,
      cuotas: masiva.medio === 'Tarjeta de crédito' ? masiva.cuotas : 1,
      mes: document.getElementById('d-mes').value,
      anio: document.getElementById('d-anio').value,
      quien: masiva.quien,
      corresponde: masiva.corresponde,
    };

    const existe = masiva.items.some(i => i.id === item.id);
    masiva.items = existe
      ? masiva.items.map(i => (i.id === item.id ? item : i))
      : [...masiva.items, item];
    masiva.menuOpenId = null;

    limpiarDraft(item);
    renderMasiva();
    document.getElementById('d-monto').focus();
    return true;
  }

  function editarItem(id) {
    const it = masiva.items.find(i => i.id === id);
    if (!it) return;
    masiva.editingId = id;
    masiva.menuOpenId = null;

    document.getElementById('d-monto').value = it.montoDisplay;
    document.getElementById('d-currency').style.display = it.montoDisplay ? 'inline' : 'none';
    document.getElementById('d-monto').placeholder = it.montoDisplay ? '' : '$0';
    document.getElementById('d-descripcion').value = it.descripcion;
    const cat = document.getElementById('d-categoria');
    cat.value = it.categoria;
    cat.classList.toggle('has-value', it.categoria !== '');

    dSelectMedio(it.medio, document.querySelector(`#d-seg-medio [data-value="${it.medio}"]`));
    masiva.cuotas = it.cuotas;
    dUpdateCuotas();

    document.getElementById('d-mes').value  = it.mes;
    document.getElementById('d-anio').value = it.anio;
    dSelectSegment('quien', it.quien, document.querySelector(`#d-seg-quien [data-value="${it.quien}"]`));
    dSelectSegment('corresponde', it.corresponde, document.querySelector(`#d-seg-corresponde [data-value="${it.corresponde}"]`));

    renderMasiva();
    document.getElementById('d-monto').focus();
  }

  function eliminarItem(id) {
    masiva.items = masiva.items.filter(i => i.id !== id);
    masiva.menuOpenId = null;
    if (masiva.editingId === id) limpiarDraft();
    renderMasiva();
  }

  function toggleMenuItem(id) {
    masiva.menuOpenId = masiva.menuOpenId === id ? null : id;
    renderMasiva();
  }

  function renderMasiva() {
    const n = masiva.items.length;

    document.getElementById('masiva-contador').textContent =
      n === 0 ? 'Ningún gasto cargado' : n === 1 ? '1 gasto cargado' : `${n} gastos cargados`;

    document.getElementById('lista-section').style.display = n ? 'block' : 'none';

    const cont = document.getElementById('lista-items');
    cont.innerHTML = masiva.items.map((it, idx) => {
      const esCuotas = it.medio === 'Tarjeta de crédito' && it.cuotas > 1;
      const meta = esCuotas
        ? `${it.categoria} · ${it.cuotas} cuotas`
        : `${it.categoria} · ${it.medio === 'Contado' ? 'Contado' : 'Tarjeta'}`;
      const metaCtx = `${MESES_CORTO[parseInt(it.mes, 10) - 1]} ${it.anio} · Pagó ${it.quien} · ${it.corresponde}`;
      const borde = idx === n - 1 ? 'border-bottom:none;' : '';
      return `
        <div class="item-row" style="${borde}">
          <div class="item-main">
            <div class="item-desc">${escapeHtml(it.descripcion)}</div>
            <div class="item-meta">${escapeHtml(meta)}</div>
            <div class="item-meta-ctx">${escapeHtml(metaCtx)}</div>
          </div>
          <span class="item-monto">$${escapeHtml(it.montoDisplay)}</span>
          <button type="button" class="item-menu-btn" data-id="${it.id}" onclick="toggleMenuItem(${it.id})">⋯</button>
        </div>`;
    }).join('');

    const total = masiva.items.reduce((a, i) => a + i.monto, 0);
    document.getElementById('lista-total').textContent =
      '$' + total.toLocaleString('es-AR').replace(/,/g, '.');

    document.getElementById('draft-titulo').textContent =
      masiva.editingId ? 'Editar gasto' : `Gasto ${n + 1}`;
    document.getElementById('draft-btn').textContent =
      masiva.editingId ? 'Guardar cambios' : '+ Nuevo gasto';
    document.getElementById('masiva-submit').textContent =
      n > 1 ? `Registrar ${n} gastos` : 'Registrar gastos';

    renderMenuItem();
  }

  // El menú se dibuja fuera del card (a nivel de body) para que no lo recorte
  // el overflow del contenedor de la lista
  function renderMenuItem() {
    const layer = document.getElementById('item-menu-layer');
    layer.innerHTML = '';
    if (masiva.menuOpenId === null) return;

    const id  = masiva.menuOpenId;
    const btn = document.querySelector(`.item-menu-btn[data-id="${id}"]`);
    if (!btn) { masiva.menuOpenId = null; return; }

    const menu = document.createElement('div');
    menu.className = 'item-menu';
    menu.innerHTML =
      `<button type="button" onclick="editarItem(${id})">Editar</button>` +
      `<button type="button" onclick="eliminarItem(${id})">Eliminar</button>`;
    layer.appendChild(menu);

    const r     = btn.getBoundingClientRect();
    const alto  = menu.offsetHeight;
    const abajo = r.bottom + 6;
    const cabe  = abajo + alto <= window.innerHeight - 12;
    menu.style.top   = (cabe ? abajo : Math.max(12, r.top - 6 - alto)) + 'px';
    menu.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
  }

  function filasDeItem(it) {
    const mesResumen  = parseInt(it.mes, 10);
    const anioResumen = parseInt(it.anio, 10);
    const esCuotas = it.medio === 'Tarjeta de crédito' && it.cuotas > 1;
    const filas = [];
    for (let i = 0; i < (esCuotas ? it.cuotas : 1); i++) {
      const mesIdx = (mesResumen - 1 + i) % 12;
      filas.push({
        quienPago:        it.quien,
        correspondea:     it.corresponde,
        descripcion:      it.descripcion,
        categoria:        it.categoria,
        monto:            it.monto,
        medioPago:        it.medio,
        esCuotas:         esCuotas ? 'Sí' : 'No',
        numeroCuota:      esCuotas ? i + 1 : 1,
        totalCuotas:      esCuotas ? it.cuotas : 1,
        montoTotal:       it.monto,
        montoCuota:       esCuotas ? it.monto / it.cuotas : it.monto,
        mesResumen:       MESES[mesIdx],
        mesResumenNumero: mesIdx + 1,
        anioResumen:      anioResumen + Math.floor((mesResumen - 1 + i) / 12),
      });
    }
    return filas;
  }

  async function registrarMasivo() {
    // Si quedó un gasto a medio cargar en el formulario, lo confirmamos primero.
    // Si no pasa la validación cortamos: el toast ya explica qué falta y así no
    // se pierde lo que el usuario venía tipeando
    if (dGetMonto() > 0 || document.getElementById('d-descripcion').value.trim()) {
      if (!confirmarGasto()) return;
    }

    const lista = masiva.items;
    if (!lista.length) return showToast('⚠️ Cargá al menos un gasto', 'error');

    const filas = lista.flatMap(filasDeItem);
    const btn = document.getElementById('masiva-submit');
    btn.disabled = true;
    showToast('Registrando gastos…', '', true);

    const demora = avisoDemora();

    try {
      await enviarFilas(filas);
      showToast(lista.length === 1
        ? '✓ Se registró el gasto'
        : `✓ Se registraron los ${lista.length} gastos`, 'success');
      // La lista solo se vacía con la escritura confirmada; si falla, los
      // gastos quedan cargados para reintentar sin volver a tipearlos
      masiva.items = [];
      masiva.menuOpenId = null;
      limpiarDraft();
      renderMasiva();
    } catch (err) {
      console.error(err);
      showToast(lista.length === 1
        ? 'No se pudo registrar. El gasto sigue cargado.'
        : `No se pudo registrar. Los ${lista.length} gastos siguen cargados.`, 'error');
    } finally {
      clearTimeout(demora);
      btn.disabled = false;
      renderMasiva();
    }
  }

  initMasiva();

</script>
</body>
